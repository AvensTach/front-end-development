<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Feedback - JS Portal</title>
</head>
<body>
<header>
    <img src="media/logo.png" alt="JS Portal Logo" width="50">
    <h1>JS Portal - Feedback</h1>
    <button onclick="window.location.href='index.html'">Go to Main Page</button>
</header>

<main>
    <!-- Feedback form -->
    <form action="#" method="post">

        <!-- Grouped fields 1, 2, 3, and 4 surrounded by a border with a legend -->
        <fieldset>
            <legend>Personal Information</legend>

            <label for="fullname">Full Name:</label><br>
            <input type="text" id="fullname" name="fullname" required><br><br>

            <label for="email">E-mail:</label><br>
            <input type="email" id="email" name="email" required><br><br>

            <label for="age">Age:</label><br>
            <input type="number" id="age" name="age" min="10" max="100" required><br><br>

            <p>Are you already learning the language?</p>
            <label><input type="radio" name="experience" value="pro"> Yes, I am a pro</label><br>
            <label><input type="radio" name="experience" value="basics"> Yes, but I know the basics</label><br>
            <label><input type="radio" name="experience" value="planning"> I am planning to</label><br>
            <label><input type="radio" name="experience" value="no"> No</label><br>
        </fieldset>
        <br>

        <!-- Dropdown list for the purpose of feedback -->
        <label for="purpose">Purpose of feedback:</label><br>
        <select id="purpose" name="purpose">
            <option value="cooperation">Cooperation</option>
            <option value="complaint">Complaint about poor quality content</option>
            <option value="suggestion">Suggestion</option>
            <option value="error">Error presence</option>
        </select><br><br>

        <!-- Textarea with constraints on height, width, and character count -->
        <label for="details">Details:</label><br>
        <textarea id="details" name="details" rows="6" cols="50" maxlength="500"
                  placeholder="Enter your message here (up to 500 characters)..."></textarea><br><br>

        <!-- Consent checkbox field -->
        <label>
            <input type="checkbox" name="consent" required>
            I consent to the processing of my personal information
        </label><br><br>

        <!-- Buttons for submitting and resetting the form data -->
        <button type="submit">Submit</button>
        <button type="reset">Clear Form</button>
    </form>
</main>
</body>
</html>
