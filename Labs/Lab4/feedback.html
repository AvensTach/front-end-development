<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Feedback - JS Portal</title>
    <link rel="stylesheet" href="CSS/styles.css">
</head>
<body>

<header style="padding: 20px; background: white; text-align: center; border-bottom: 1px solid #eaeaea;">
    <img src="media/logo.png" alt="JS Portal Logo" width="50">
    <h1>JS Portal - Feedback</h1>
    <button onclick="window.location.href='index.html'" style="padding: 5px 10px; margin-top: 10px;">Go to Main Page</button>
</header>

<main class="feedback-main">
    <form action="#" method="post" class="flex-container">

        <fieldset class="flex-item">
            <legend>Personal Information</legend>
            <label for="fullname">Full Name:</label>
            <input type="text" id="fullname" name="fullname" required style="margin-bottom: 10px;">

            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" required style="margin-bottom: 10px;">

            <label for="age">Age:</label>
            <input type="number" id="age" name="age" min="10" max="100" required style="margin-bottom: 15px;">

            <p style="margin-bottom: 5px;">Are you already learning the language?</p>
            <label><input type="radio" name="experience" value="pro"> Yes, I am a pro</label>
            <label><input type="radio" name="experience" value="basics"> Yes, but I know the basics</label>
            <label><input type="radio" name="experience" value="planning"> I am planning to</label>
            <label><input type="radio" name="experience" value="no"> No</label>
        </fieldset>

        <div class="flex-item">
            <label for="purpose">Purpose of feedback:</label>
            <select id="purpose" name="purpose" style="padding: 8px;">
                <option value="cooperation">Cooperation</option>
                <option value="complaint">Complaint about poor quality content</option>
                <option value="suggestion">Suggestion</option>
                <option value="error">Error presence</option>
            </select>
        </div>

        <div class="flex-item">
            <label for="details">Details:</label>
            <textarea id="details" name="details" rows="6" maxlength="500" placeholder="Enter your message here (up to 500 characters)..." style="padding: 10px; resize: vertical;"></textarea>
        </div>

        <div class="flex-item" style="flex-direction: row; align-items: center; gap: 10px;">
            <input type="checkbox" name="consent" id="consent" required>
            <label for="consent">I consent to the processing of my personal information</label>
        </div>

        <div class="flex-btn-group">
            <button type="submit" class="btn-submit">Submit</button>
            <button type="reset" class="btn-reset">Clear Form</button>
        </div>
    </form>
</main>

</body>
</html>
